# Temporary: generates Gemfile.lock on Linux so it can be committed. Delete after use.
name: tmp lockfile
on:
  push:
    branches: [setup/al-folio-base]
    paths: [".github/workflows/tmp-lockfile.yml"]
jobs:
  lock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
      - run: bundle lock --add-platform x86_64-linux
      - uses: actions/upload-artifact@v7
        with:
          name: gemfile-lock
          path: Gemfile.lock
