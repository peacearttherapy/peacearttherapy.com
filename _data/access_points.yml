- title: Private Pay (outpatient)
  body: Practices like Peace Art Therapy and Spencer & Associates Therapeutic Alliance offer group and individual art therapy through private pay.
- title: Community-Based (at partnering agencies)
  body: Partnerships with agencies like Yes Arts provide access to Peace Art Therapy groups at no cost to the participants. As an individual, you access the opportunity through the partnering organization, agency, non-profit, residential treatment site, or day center. Community organizations may offer these on a limited basis depending on their scheduling and resources.
- title: Medical Facilities (inpatient)
  body: Hospitals, like UK HealthCare and Eastern State Hospital, have on-site art therapy programs
- title: Public Schools
  body: If your child has an IEP, seek an eligibility evaluation for art therapy to be provided at no cost through the school system. Designated as a related service, it must be deemed necessary for their academic growth.
